name: Prompt Folio validation

on:
  push:
  pull_request:

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: node --check app.js
      - name: Validate required site files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f 404.html
          test -f CNAME
          test -f robots.txt
          test -f sitemap.xml
          test -f PORTFOLIO-CONTENT-CONTRACT.md
          grep -Fxq 'mokshith-ai-security.is-a.dev' CNAME
          grep -Fq 'https://mokshith-ai-security.is-a.dev/' index.html
          grep -Fq 'https://mokshith-ai-security.is-a.dev/sitemap.xml' robots.txt
          grep -Fq '<loc>https://mokshith-ai-security.is-a.dev/</loc>' sitemap.xml
      - name: Run portfolio smoke checks
        run: node tests/portfolio-smoke.mjs
      - name: Validate grounded-content boundaries
        run: |
          grep -q 'TechCiti Technologies Private Limited' index.html
          grep -q 'InAmigos Foundation (IAF)' index.html
          grep -q 'Cybersecurity résumé' PORTFOLIO-CONTENT-CONTRACT.md
          grep -q 'AI / ML + Prompt Engineering' PORTFOLIO-CONTENT-CONTRACT.md
          grep -q 'needs-source' PORTFOLIO-CONTENT-CONTRACT.md
          grep -q 'blocked' PORTFOLIO-CONTENT-CONTRACT.md
          grep -q 'I don.t have verified information' app.js || true
      - name: Validate résumé assets and links
        run: |
          test -f resumes/MOKSHITH_Cybrarian-Resume.pdf
          test -f resumes/MOKSHITH_AIML-Resume.pdf
          test "$(head -c 5 resumes/MOKSHITH_Cybrarian-Resume.pdf)" = '%PDF-'
          test "$(head -c 5 resumes/MOKSHITH_AIML-Resume.pdf)" = '%PDF-'
          grep -Fq 'resumes/MOKSHITH_Cybrarian-Resume.pdf' index.html
          grep -Fq 'resumes/MOKSHITH_AIML-Resume.pdf' index.html
          ! grep -q 'PDF asset required' index.html
          grep -q 'Résumé PDFs verified in the repository' index.html
      - name: Check for obvious credential material
        run: |
          ! grep -RniE '(sk-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY)' --exclude-dir=.git .
